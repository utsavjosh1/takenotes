appId: com.takenotes.app
productName: takenotes
# Electron fuses (§8): flipped on every packaged binary via afterPack.
# Expected state is recorded in docs/audit/electron-fuses.md; CI verifies
# with `npx @electron/fuses read` after packaging.
afterPack: ./scripts/after-pack-fuses.mjs
# Per-OS artifact names (§124). ${os}/${arch}/${ext} are electron-builder
# template variables — one app version across platforms (§187).
artifactName: takenotes-${version}-${os}-${arch}.${ext}
# Native icons are exported from `public/takenotes-app-icon-filled.svg`
# (filled tile, small-size tuned; outline `takenotes-app-icon.svg` stays in-app).
# Electron cannot use SVG for binaries - export once, then packaging is automatic:
#   build/icon.ico (256px multi-size, Windows) - build/icon.icns (macOS) -
#   build/icon.png (512px, Linux + BrowserWindow runtime icon).
# Until those exports land, packaging continues with Electron defaults.
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - dist/renderer/**/*
  - package.json
  # Package content audit (§198): never ship tests, secrets, history, or
  # prototype code inside any installer/dmg/package.
  - "!**/tests/**"
  - "!**/.git/**"
  - "!**/.env*"
  - "!**/SilverBullet/**"
  - "!**/*.test.*"
# WSL runtime + helper are required on Windows (§16). Bundled via
# extraResources below (generated/ archive excluded by filter).
extraResources:
  # Runtime BrowserWindow icon: resolveWindowIcon() reads
  # <resources>/build/icon.png in the packaged app. Without this,
  # the packaged window falls back to the Electron default icon.
  - from: build/icon.png
    to: build/icon.png
  - from: resources/wsl/linux-x64
    to: wsl/linux-x64
    filter:
      - "**/*"
      - "!generated/**"
      - "!**/*.tar.xz"
win:
  icon: build/icon.ico
  target:
    # NSIS installer + portable ZIP, x64 only. The updater (ADR-0006)
    # downloads the NSIS .exe; the ZIP is the no-install fallback.
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # Authenticode signing gate (§125, §192). Unsigned dev builds are fine;
  # stable public builds must set WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD in CI
  # and flip `signAndEditExecutable` on via release workflow env.
  signAndEditExecutable: false
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Uninstall must NEVER delete user Markdown workspaces (§140, §142).
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish: null
