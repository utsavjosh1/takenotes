# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  auto_review:
    base_branches:
      - ".*"
  path_filters:
    - "!design/**"
    - "!new/**"
    - "!docs/**"
    - "!reference/**"
    - "!**/generated.ts"
    - "!**/tokens.css"
    - "!package-lock.json"
    - "!MIGRATION_AUDIT.md"
    - "!tests/**/__snapshots__/**"
