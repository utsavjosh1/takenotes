name: Release
on:
  push:
    tags:
      - "v*.*.*"

# Default-deny permissions (§11): every job declares only what it needs.
# The `publish` job alone gets release powers (contents:write for the
# GitHub Release, id-token + attestations for artifact provenance).
permissions:
  contents: read

jobs:
  # Multi-OS pipeline: Windows installers bundle the WSL runtime
  # (wsl-runtime -> windows). macOS and Ubuntu build natively on their own
  # runners with no WSL payload and no runtime download.
  wsl-runtime:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:server
      - run: npm run build:helper
      - run: node tools/scripts/fetch-wsl-runtime.mjs
      - run: node tools/scripts/stage-wsl-runtime.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsl-runtime
          path: resources/wsl/linux-x64/

  windows:
    runs-on: windows-latest
    needs: wsl-runtime
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wsl-runtime
          path: resources/wsl/linux-x64/
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:verify
        env:
          REQUIRE_INSTALLER: "0"
      - run: npm run package:win
        env:
          # Authenticode for stable public builds (§125, §192).
          # Empty → unsigned dev artifact that still validates packaging.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify packaged asar boots (renderer + main in app.asar)
        run: node tools/scripts/verify-packaged.mjs
      - name: Verify Electron fuses (packaged binary)
        shell: pwsh
        run: npx --no-install @electron/fuses read --app "release/win-unpacked/takenotes.exe"
      # Installers only — the single SHA256SUMS.txt for all OSs is
      # generated in `publish` so one checksum file covers every asset.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.zip

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # WSL runtime is Windows-only: stage an empty dir so the
      # electron-builder extraResources `from` still resolves.
      - run: mkdir -p resources/wsl/linux-x64
      - run: npm run package:mac
        env:
          # Unsigned beta: no Apple Developer ID in CI (right-click →
          # Open on first launch). Stable builds should add signing +
          # notarization here.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Electron fuses (packaged app bundles)
        run: |
          npx --no-install @electron/fuses read --app "release/mac/takenotes.app"
          npx --no-install @electron/fuses read --app "release/mac-arm64/takenotes.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            release/*.dmg

  ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # WSL runtime is Windows-only: stage an empty dir so the
      # electron-builder extraResources `from` still resolves.
      - run: mkdir -p resources/wsl/linux-x64
      - run: npm run package:linux
      - name: Verify Electron fuses (packaged binary)
        run: npx --no-install @electron/fuses read --app "release/linux-unpacked/takenotes"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-release
          path: |
            release/*.AppImage
            release/*.deb

  publish:
    runs-on: windows-latest
    # Multi-OS release: a release ships when Windows + macOS + Ubuntu
    # installers all succeed. One SHA256SUMS.txt covers every asset.
    needs: [windows, macos, ubuntu]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-release
          path: release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ubuntu-release
          path: release/
      # Installers only: exe + zip (Windows), dmg x64/arm64 (macOS),
      # AppImage + deb (Ubuntu). No source archives, no unpacked dirs.
      - name: Check artifacts
        shell: bash
        run: |
          ls -la release/
      - run: npm run version:check
      - run: npm run build
      - run: npm run release:verify
        env:
          REQUIRE_INSTALLER: "1"
      - name: Generate SHA256SUMS.txt (one file, every installer)
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.zip *.dmg *.AppImage *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build release notes
        run: node tools/scripts/release-notes.mjs > release/NOTES.md
      # SPDX SBOM (§13): generated from the locked dependency tree with the
      # npm CLI — no extra runtime dependency. Scope: Node dependencies +
      # Electron runtime version; native installer binaries are checksummed
      # (SHA256SUMS.txt) rather than inventoried.
      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format spdx --omit dev > "release/takenotes-${{ github.ref_name }}.spdx.json"
      # Artifact provenance (§12): GitHub attestation over every distributable.
      # Requires a public repo / supported account tier; if attestation is
      # unavailable the release still ships with SHA256SUMS + SBOM and the
      # provenance gap stays documented (never silently claimed).
      - name: Attest release artifacts
        # Private repos cannot persist attestations (GitHub 403); the
        # release still ships with SHA256SUMS + SBOM and the gap stays
        # documented — never fail the release over provenance alone.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/*.exe, release/*.zip, release/*.dmg, release/*.AppImage, release/*.deb"
      - name: Create GitHub Release
        # Pinned to v2.3.2: v3.0.3 fails deterministically on the 144MB exe
        # with "Error creating asset temp dir" (issue #12). Re-upgrade only
        # with a proven large-asset upload.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
            release/*.spdx.json
          body_path: release/NOTES.md
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
