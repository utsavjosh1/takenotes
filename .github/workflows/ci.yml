name: CI
on:
  pull_request:
  push:
    branches: [main]

# Default-deny: CI only reads the repo (§11).
permissions:
  contents: read

jobs:
  # Windows-only gate (Windows 11 x64 + WSL2 is the sole target).
  # Ubuntu/macOS jobs were removed: they duplicated the same logic suite
  # while doubling queue time. Re-add per-OS only with a proven
  # Windows-uncatchable failure.
  check-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
